# ============================================================
# Serverless Devs 配置文件 (s.yaml)  — edition 3.0.0
# 文档: https://docs.serverless-devs.com/user-guide/spec/
# ============================================================

edition: 3.0.0
name: gzhlaker-fc
access: default

vars:
  region: cn-hongkong

resources:
  paper-processor:
    component: fc3
    props:
      region: ${vars.region}
      functionName: gzhlaker-processor
      description: 下载/总结/发送论文
      runtime: python3.10
      handler: main.handler
      code: ./
      memorySize: 512
      timeout: 600
      environmentVariables:
        # ---- OSS ----
        OSS_ACCESS_KEY: ""
        OSS_SECRET_KEY: ""
        OSS_BUCKET_NAME: gzhlaker-papers
        OSS_ENDPOINT_INTERNAL: oss-cn-hongkong-internal.aliyuncs.com
        OSS_ENDPOINT_ACCELERATE: oss-accelerate.aliyuncs.com
        # ---- OpenRouter ----
        OPENROUTER_API_KEY: ""
        OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
        OPENROUTER_MODEL: openrouter/auto
        OPENROUTER_AUTO_ALLOWED_MODELS: ""
        # ---- Coze (可选) ----
        COZE_API_TOKEN: ""
        COZE_WORKFLOW_ID: "7489008649470378025"
        # ---- 飞书 ----
        FEISHU_APP_ID: ""
        FEISHU_APP_SECRET: ""
        FEISHU_RECEIVE_ID: ""
        # ---- Telegram (可选) ----
        TELEGRAM_BOT_TOKEN: ""
        TELEGRAM_CHAT_ID: ""
        # ---- 发送通道 ----
        SEND_CHANNELS: feishu
