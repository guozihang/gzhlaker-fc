# Serverless Devs 配置文件 (s.yaml)  — edition 3.0.0
# 文档: https://docs.serverless-devs.com/user-guide/spec/
# ============================================================
# 使用前修改:
#   vars.region     → 函数所在区域
#   vars.serviceName → 服务名称
#   resources 中的 functionName → 函数名称
# ============================================================

edition: 3.0.0
name: gzhlaker-fc
access: default
resources:
  paper-processor:
    component: fc3
    props:
      region: cn-hongkong
      functionName: gzhlaker-processor
      description: 下载/总结/发送论文
      runtime: python3.10
      handler: main.handler
      code: ./
      memorySize: 512
      timeout: 600
      layers:
        - acs:fc:cn-hongkong:official:layers/Python310-OSS2/versions/1
        - >-
          acs:fc:cn-hongkong:1324091693163334:layers/gzhlaker-reading-layer/versions/6
      environmentVariables:            
        # OSS 配置（通过函数计算环境变量注入，替换代码中的硬编码默认值）
        OSS_ACCESS_KEY: ${env(OSS_ACCESS_KEY)}
        OSS_SECRET_KEY: ${env(OSS_SECRET_KEY)}
        OSS_BUCKET_NAME: gzhlaker-papers
        OSS_ENDPOINT_INTERNAL: oss-cn-hongkong-internal.aliyuncs.com
        OSS_ENDPOINT_ACCELERATE: oss-accelerate.aliyuncs.com
        # LLM 配置
        OPENROUTER_API_KEY: ${env(OPENROUTER_API_KEY)}
        OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
        OPENROUTER_MODEL: arcee-ai/trinity-large-preview:free
        # 飞书配置
        FEISHU_APP_ID: ${env(FEISHU_APP_ID)}
        FEISHU_APP_SECRET: ${env(FEISHU_APP_SECRET)}
        FEISHU_RECEIVE_ID: ${env(FEISHU_RECEIVE_ID)}
        # Telegram 配置（可选）
        TELEGRAM_BOT_TOKEN: ${env(TELEGRAM_BOT_TOKEN)}
        TELEGRAM_CHAT_ID: ${env(TELEGRAM_CHAT_ID)}
        # 默认发送通道
        SEND_CHANNELS: feishu
      triggers:
      # ---- 凌晨 1:00 下载论文 + 抽取文本 ----
      - triggerName: step1-download-extract
        triggerType: timer
        qualifier: LATEST
        triggerConfig:
          cronExpression: '0 0 1 * * *'
          enable: true
          payload: '{"step":"download_extract"}'
      # ---- 凌晨 2:00 大模型总结论文 ----
      - triggerName: step2-summarize
        triggerType: timer
        qualifier: LATEST
        triggerConfig:
          cronExpression: '0 0 2 * * *'
          enable: true
          payload: '{"step":"summarize"}'
      # ---- 凌晨 3:00 多通道发送 ----
      - triggerName: step3-send
        triggerType: timer
        qualifier: LATEST
        triggerConfig:
          cronExpression: '0 0 3 * * *'
          enable: true
          payload: '{"step":"send","channels":["telegram"]}'
      # ---- 早上 9:00 CCF 投稿截止倒计时 ----
      - triggerName: step4-ccf-check
        triggerType: timer
        qualifier: LATEST
        triggerConfig:
          cronExpression: '0 0 9 * * *'
          enable: true
          payload: '{"step":"ccf_check"}'


