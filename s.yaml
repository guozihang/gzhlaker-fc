# ============================================================
# Serverless Devs 配置文件 (s.yaml)  — edition 3.0.0
# 文档: https://docs.serverless-devs.com/user-guide/spec/
# ============================================================
# 使用前修改:
#   vars.region     → 函数所在区域
#   vars.serviceName → 服务名称
#   resources 中的 functionName → 函数名称
# ============================================================

edition: 3.0.0
name: gzhlaker-fc
access: default

vars:
  region: cn-hongkong
  serviceName: paper-service
  serviceDesc: 论文自动处理系统

resources:
  paper-processor:                        # 资源名称
    component: fc3                        # 函数计算 3.0 组件
    props:
      region: ${vars.region}
      serviceName: ${vars.serviceName}
      description: ${vars.serviceDesc}
      functionName: gzhlaker-processor    # 函数名称
      description: 下载/总结/发送论文
      runtime: python3.10
      handler: main.handler
      code: ./
      memorySize: 512                     # 内存 MB
      timeout: 600                        # 超时秒数
      environmentVariables:
        # ---- OSS 配置 ----
        OSS_ACCESS_KEY: ""
        OSS_SECRET_KEY: ""
        OSS_BUCKET_NAME: gzhlaker-papers
        OSS_ENDPOINT_INTERNAL: oss-cn-hongkong-internal.aliyuncs.com
        OSS_ENDPOINT_ACCELERATE: oss-accelerate.aliyuncs.com
        # ---- LLM 配置 (OpenRouter) ----
        OPENROUTER_API_KEY: ""
        OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
        OPENROUTER_MODEL: openrouter/auto
        OPENROUTER_AUTO_ALLOWED_MODELS: ""
        # ---- Coze 配置 (可选) ----
        COZE_API_TOKEN: ""
        COZE_WORKFLOW_ID: "7489008649470378025"
        # ---- 飞书配置 ----
        FEISHU_APP_ID: ""
        FEISHU_APP_SECRET: ""
        FEISHU_RECEIVE_ID: ""
        # ---- Telegram 配置 (可选) ----
        TELEGRAM_BOT_TOKEN: ""
        TELEGRAM_CHAT_ID: ""
        # ---- 发送通道 ----
        SEND_CHANNELS: feishu
