# Serverless Devs 配置文件 (s.yaml)  — edition 3.0.0
# 文档: https://docs.serverless-devs.com/user-guide/spec/

edition: 3.0.0
name: gzhlaker-fc
access: default
resources:
  paper-processor:
    component: fc3
    props:
      region: cn-hongkong
      functionName: gzhlaker-processor
      description: 下载/总结/发送论文
      runtime: python3.10
      handler: main.handler
      code: ./
      timeout: 3000
      memorySize: 832
      cpu: 0.35
      diskSize: 10240
      internetAccess: true
      instanceIsolationMode: SHARE
      sessionAffinity: NONE
      disableOndemand: false
      resourceGroupId: rg-acfmxv2fvdwwgrq
      role: ''
      layers:
        - acs:fc:cn-hongkong:official:layers/Python310-OSS2/versions/1
        - >-
          acs:fc:cn-hongkong:1324091693163334:layers/gzhlaker-reading-layer/versions/11
      logConfig:
        enableRequestMetrics: true
        enableInstanceMetrics: true
        logBeginRule: DefaultRegex
        project: serverless-cn-hongkong-8de70aa5-ab5d-5ce2-ad0e-422f963dc3b5
        logstore: default-logs
        enableLlmMetrics: false
      environmentVariables:
        # OSS 配置
        OSS_ACCESS_KEY: ${env(OSS_ACCESS_KEY)}
        OSS_SECRET_KEY: ${env(OSS_SECRET_KEY)}
        OSS_BUCKET_NAME: gzhlaker-papers
        OSS_ENDPOINT_INTERNAL: oss-cn-hongkong-internal.aliyuncs.com
        OSS_ENDPOINT_ACCELERATE: oss-accelerate.aliyuncs.com
        # LLM 配置
        OPENROUTER_API_KEY: ${env(OPENROUTER_API_KEY)}
        OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
        OPENROUTER_MODEL: openrouter/free
        # 飞书配置
        FEISHU_APP_ID: ${env(FEISHU_APP_ID)}
        FEISHU_APP_SECRET: ${env(FEISHU_APP_SECRET)}
        FEISHU_RECEIVE_ID: ${env(FEISHU_RECEIVE_ID)}
        # Telegram 配置
        TELEGRAM_BOT_TOKEN: ${env(TELEGRAM_BOT_TOKEN)}
        TELEGRAM_CHAT_ID: ${env(TELEGRAM_CHAT_ID)}
        # 滴答清单配置
        DIDA_USERNAME: ${env(DIDA_USERNAME)}
        DIDA_PASSWORD: ${env(DIDA_PASSWORD)}
        # 默认发送通道
        SEND_CHANNELS: feishu
      triggers:
        # ---- Step 1: 下载论文 + 抽取文本 (每天 3 次: 00:00 / 08:00 / 16:00) ----
        - triggerName: step1-download-extract
          triggerType: timer
          qualifier: LATEST
          description: ''
          triggerConfig:
            cronExpression: CRON_TZ=Asia/Shanghai 0 0 0,8,16 * * *
            enable: true
            payload: '{"step":"download_extract"}'
        # ---- Step 2: 大模型总结论文 (每天 3 次: 02:00 / 10:00 / 18:00) ----
        - triggerName: step2-summarize
          triggerType: timer
          qualifier: LATEST
          description: ''
          triggerConfig:
            cronExpression: CRON_TZ=Asia/Shanghai 0 0 2,10,18 * * *
            enable: true
            payload: '{"step":"summarize"}'
        # ---- Step 4: 每周总结 (每周一 08:00) ----
        - triggerName: step4-weekly-summary
          triggerType: timer
          qualifier: LATEST
          description: ''
          triggerConfig:
            cronExpression: CRON_TZ=Asia/Shanghai 0 0 8 * * 1
            enable: true
            payload: '{"step":"weekly_summary"}'
