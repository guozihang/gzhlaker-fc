# ============================================================
# GitHub Actions: 自动部署到阿里云函数计算 FC
# ============================================================
# 触发条件:
#   1. 推送到 main 分支（自动）
#   2. 手动触发（GitHub Actions 页面 → Run workflow）
#
# 使用前需要在 GitHub 仓库 Settings → Secrets and variables → Actions
# 中添加以下 Secrets:
#   - ALIYUN_ACCOUNT_ID           阿里云账号 ID
#   - ALIYUN_ACCESS_KEY_ID        RAM AccessKey ID
#   - ALIYUN_ACCESS_KEY_SECRET    RAM AccessKey Secret
#   - OSS_ACCESS_KEY              OSS AccessKey
#   - OSS_SECRET_KEY              OSS SecretKey
#   - OPENROUTER_API_KEY          OpenRouter API Key
#   - TELEGRAM_BOT_TOKEN          Telegram Bot Token
#   - TELEGRAM_CHAT_ID            Telegram Chat ID
#   - DIDA_PHONE                  滴答清单手机号
#   - DIDA_PASSWORD               滴答清单密码
# ============================================================

name: Deploy to Aliyun FC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Serverless Devs CLI（基于 Node.js 的部署工具）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Serverless Devs CLI
        run: npm install -g @serverless-devs/s

      # 3. 配置阿里云账号凭证（来自 GitHub Secrets）
      - name: Configure Aliyun credentials
        run: |
          s config add \
            --AccountID ${{ secrets.ALIYUN_ACCOUNT_ID }} \
            --AccessKeyID ${{ secrets.ALIYUN_ACCESS_KEY_ID }} \
            --AccessKeySecret ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }} \
            -a default

      # 4. 先删除旧函数再重新创建（避免配置变更时的更新冲突）
      - name: Remove old function
        continue-on-error: true
        env:
          OSS_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY }}
          OSS_SECRET_KEY: ${{ secrets.OSS_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIDA_PHONE: ${{ secrets.DIDA_PHONE }}
          DIDA_PASSWORD: ${{ secrets.DIDA_PASSWORD }}
        run: s remove --assume-yes

      # 5. 重新创建函数（环境变量从 GitHub Secrets 注入，s.yaml 中 ${env(...)} 自动替换）
      - name: Deploy to Aliyun FC
        env:
          OSS_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY }}
          OSS_SECRET_KEY: ${{ secrets.OSS_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIDA_PHONE: ${{ secrets.DIDA_PHONE }}
          DIDA_PASSWORD: ${{ secrets.DIDA_PASSWORD }}
        run: s deploy --assume-yes
